name: Build & Release (Windows)

# Auto-package: builds the Aether Todo installer on Windows and publishes a
# GitHub Release (with the Setup.exe) whenever a tag like v1.2.0 is pushed,
# or when triggered manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies + Electron binary
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          bun install
          node node_modules/electron/install.js

      - name: Build installer (NSIS)
        run: bun run build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*Setup.exe
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Todo-Setup
          path: dist/*Setup.exe
