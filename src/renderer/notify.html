<!doctype html>
<html lang="zh-CN" class="notify-html" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Aether Todo · 通知</title>
    <style>
      html,
      body {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        width: 100%;
        height: 100%;
        user-select: none;
        cursor: default;
      }
    </style>
    <link rel="stylesheet" href="../renderer-dist/styles.css?v=1.1.7" />
    <script src="../renderer-dist/notify.js?v=1.1.7" defer></script>
  </head>
  <body class="notify-body">
    <!-- 液态玻璃通知卡：配色 / 圆角 / 字体 / 动效与主界面一致 -->
    <main id="notify-card" class="notify-card is-hidden" data-tone="info" role="status" aria-live="polite">
      <span id="notify-icon" class="notify-icon"></span>
      <div class="notify-text">
        <p id="notify-title" class="notify-title"></p>
        <p id="notify-body" class="notify-body"></p>
      </div>
      <button id="notify-close" class="notify-close" type="button" aria-label="关闭"></button>
      <span id="notify-progress" class="notify-progress"></span>
    </main>
  </body>
</html>
